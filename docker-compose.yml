services:
  api:
    build: .
    restart: unless-stopped
    gpus: all
    shm_size: ${SHM_SIZE:-2g}
    ports:
      - "${BIND_HOST}:${PORT}:8000"
    environment:
      SERVICE_NAME: ${SERVICE_NAME}
      MODEL_ID: ${MODEL_ID}
      MODEL_ALIAS: ${MODEL_ALIAS:-}
      API_KEY: ${API_KEY:-}
      EMBEDDING_TASK: ${EMBEDDING_TASK}
      DEFAULT_DIMENSIONS: ${DEFAULT_DIMENSIONS}
      MAX_LENGTH: ${MAX_LENGTH}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-64}
      NORMALIZE_EMBEDDINGS: ${NORMALIZE_EMBEDDINGS}
      DTYPE: ${DTYPE}
      ATTN_IMPLEMENTATION: ${ATTN_IMPLEMENTATION}
      TRUST_REMOTE_CODE: ${TRUST_REMOTE_CODE}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-}
      BATCH_WINDOW_MS: ${BATCH_WINDOW_MS:-200}
      START_DEVICE: ${START_DEVICE:-cpu}
      CPU_BATCH_TARGET: ${CPU_BATCH_TARGET:-8}
      CPU_TO_GPU_SCALE_UP_TEXTS: ${CPU_TO_GPU_SCALE_UP_TEXTS:-8}
      GPU_TO_CPU_SCALE_DOWN_TEXTS: ${GPU_TO_CPU_SCALE_DOWN_TEXTS:-2}
      GPU_TO_CPU_SCALE_DOWN_SECONDS: ${GPU_TO_CPU_SCALE_DOWN_SECONDS:-30}
      IDLE_OFFLOAD_SECONDS: ${IDLE_OFFLOAD_SECONDS:-1800}
      IDLE_OFFLOAD_POLL_SECONDS: ${IDLE_OFFLOAD_POLL_SECONDS:-30}
      REQUEST_LOG_LIMIT: ${REQUEST_LOG_LIMIT:-100000}
      EMBEDDING_CACHE_LIMIT: ${EMBEDDING_CACHE_LIMIT:-100000}
      CUDA_BATCH_GROWTH_FACTOR: ${CUDA_BATCH_GROWTH_FACTOR:-2}
      CUDA_VRAM_SAFETY_FIXED_MB: ${CUDA_VRAM_SAFETY_FIXED_MB:-512}
      CUDA_VRAM_SAFETY_TOTAL_RATIO: ${CUDA_VRAM_SAFETY_TOTAL_RATIO:-0.05}
    volumes:
      - ${HF_CACHE_DIR:-./data/hf}:/root/.cache/huggingface
